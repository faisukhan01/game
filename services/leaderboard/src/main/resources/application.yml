server:
  port: 8080

spring:
  application:
    name: voidstrike-leaderboard
  datasource:
    url: jdbc:h2:mem:ladder;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false

management:
  endpoints:
    web:
      exposure:
        include: health,prometheus,info
  metrics:
    tags:
      application: voidstrike-leaderboard
