version: "3.9"

services:
  gameserver:
    build: ../services/gameserver
    ports: ["3002:3002"]
    environment:
      PORT: "3002"
      MAX_ROOMS: "64"
    restart: unless-stopped

  leaderboard:
    build: ../services/leaderboard
    ports: ["8080:8080"]
    environment:
      SPRING_PROFILES_ACTIVE: docker
    restart: unless-stopped

  web:
    build:
      context: ..
      dockerfile: infra/Dockerfile.web
    ports: ["3000:3000"]
    environment:
      DATABASE_URL: "file:/data/voidstrike.db"
      NODE_ENV: production
    volumes:
      - webdata:/data
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v2.54.1
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports: ["9090:9090"]
    restart: unless-stopped

  grafana:
    image: grafana/grafana:11.2.0
    environment:
      GF_SECURITY_ADMIN_PASSWORD: voidstrike
    ports: ["3001:3000"]
    volumes:
      - ./monitoring/grafana-datasources.yml:/etc/grafana/provisioning/datasources/ds.yml:ro
    restart: unless-stopped

volumes:
  webdata:
