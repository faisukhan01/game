name: unreal-build

# UBT builds require Epic-licensed engine binaries — runs on demand.
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/epicgames/unreal-engine:dev-slim-5.4 # private registry mirror; configure your own
      credentials:
        username: ${{ secrets.EPIC_REGISTRY_USER }}
        password: ${{ secrets.EPIC_REGISTRY_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - name: Build editor target
        run: |
          cd clients/unreal
          /engine/Build/BatchFiles/Build.sh VoidstrikeArenaEditor Linux Development
