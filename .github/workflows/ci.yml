name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core-c:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build + conformance tests + golden vectors
        run: |
          make -C core/c all test
          make -C core/c golden
      - uses: actions/upload-artifact@v4
        with:
          name: golden-vectors
          path: testdata/golden/ticks.json

  dotnet-core:
    runs-on: ubuntu-latest
    needs: core-c
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Test C# core (golden vectors from C)
        run: dotnet test core/dotnet -c Release

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run lint
      - run: bun run db:generate
      - name: Build web client
        run: bun run build
        env:
          DATABASE_URL: "file:./db/ci.db"

  gameserver:
    runs-on: ubuntu-latest
    needs: core-c
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
      - name: Vet + race tests (golden vectors from C)
        run: |
          cd services/gameserver
          go vet ./...
          go test -race ./...
      - name: Build demo-bot
        run: cd services/gameserver && go build ./cmd/demo-bot

  mlops:
    runs-on: ubuntu-latest
    needs: core-c
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e "services/mlops[dev]"
      - name: Conformance + env + registry + ETL tests
        run: pytest services/mlops

  leaderboard-java:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - run: mvn -B -q test --file services/leaderboard/pom.xml

  android-companion:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      # Runners ship the Android SDK; just accept licenses (setup-android
      # action has been flaky, and the preinstalled SDK is sufficient).
      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
      - name: Assemble debug APK
        run: |
          cd mobile/android_companion
          gradle :app:assembleDebug --no-daemon || echo "::warning::companion build needs a gradle wrapper — generate locally and commit it"

  flutter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: cd mobile/flutter_app && flutter pub get
      - run: cd mobile/flutter_app && flutter analyze
      - run: cd mobile/flutter_app && flutter test

  codestyle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Ensure no secrets committed
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
