name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  packages: write

jobs:
  images:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - name: gameserver
            context: services/gameserver
          - name: mlops
            context: services/mlops
          - name: leaderboard
            context: services/leaderboard
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/voidstrike-${{ matrix.name }}:${{ github.ref_name }}
            ghcr.io/${{ github.repository_owner }}/voidstrike-${{ matrix.name }}:latest

  web-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - name: Generate Prisma client
        run: bunx prisma generate
      - run: bun run build
        env:
          DATABASE_URL: "file:./db/release.db"
      - name: Deploy web (placeholder — wire your edge target)
        run: 'echo "TODO: deploy .next/standalone to your edge/VM target"'

  apk-tag:
    # Versioned mobile APK for v* tags (rolling builds live in android-apk.yml).
    name: APK for ${{ github.ref_name }}
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    defaults:
      run:
        working-directory: mobile/flutter_app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - run: flutter build apk --release
      - name: Attach APK to the tag release
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          VERSION=$(grep -m1 '^version:' mobile/flutter_app/pubspec.yaml | awk '{print $2}' | cut -d+ -f1)
          SHORT_SHA=${GITHUB_SHA::7}
          cp mobile/flutter_app/build/app/outputs/flutter-apk/app-release.apk \
             "/tmp/VOIDSTRIKE-mobile-v${VERSION}-${SHORT_SHA}.apk"
          TAG="${GITHUB_REF_NAME}"
          if gh release view "$TAG" -R "$REPO" > /dev/null 2>&1; then
            gh release upload "$TAG" \
               "/tmp/VOIDSTRIKE-mobile-v${VERSION}-${SHORT_SHA}.apk" --clobber -R "$REPO"
          else
            gh release create "$TAG" \
               "/tmp/VOIDSTRIKE-mobile-v${VERSION}-${SHORT_SHA}.apk" \
               -R "$REPO" --title "VOIDSTRIKE ${TAG}" --generate-notes --latest
          fi

  changelog:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
